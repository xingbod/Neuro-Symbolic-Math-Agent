[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-symbolic-math-agent"
version = "0.1.0"
description = "Verifier-gated generation of isomorphic math variants and step-focused scaffolds"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["sympy>=1.13,<2", "requests>=2.31,<3"]

[project.scripts]
math-agent = "neuro_symbolic_math_agent.cli:main"
math-agent-download = "neuro_symbolic_math_agent.benchmark_cli:download_main"
math-agent-benchmark = "neuro_symbolic_math_agent.benchmark_cli:benchmark_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


